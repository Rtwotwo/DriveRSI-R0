[source]
repository = "https://github.com/Emerge-Lab/PufferDrive.git"
revision = "02f1008c12f3920ba3cd076d5204b2747a8c5cb2"
license = "MIT"

[runtime]
dt_seconds = 0.1
max_actors = 32
max_steps = 90
action_space = "jerk_discrete_12"
zero_jerk_action = 7
goal_behavior = "stop"
collision_behavior = "stop"
offroad_behavior = "stop"
traffic_signals = false
map_elevation = false
centering = "initial_actor_positions_and_fixed_map"
metric_observation = "metric-v1"
zero_curvature = "preserve_physical_zero_for_left_right_symmetry"

[build]
raylib_version = "5.5"
raylib_url = "https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_linux_amd64.tar.gz"
