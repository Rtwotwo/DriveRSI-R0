# Canonical navtrain_simscale split used by ChainFlow stage-1 training.
# Its real source intentionally combines navtrain + navval (103,288 samples).
# PDM 0-4 adds 204,831 samples, for 308,119 training samples in total.
defaults:
  - scene_filter: navtrain
  - /train_test_split_synthetic/scene_filter@_global_.train_test_split.synthetic_sources.pdm_0.scene_filter: synthetic_reaction_pdm_v1.0-0
  - /train_test_split_synthetic/scene_filter@_global_.train_test_split.synthetic_sources.pdm_1.scene_filter: synthetic_reaction_pdm_v1.0-1
  - /train_test_split_synthetic/scene_filter@_global_.train_test_split.synthetic_sources.pdm_2.scene_filter: synthetic_reaction_pdm_v1.0-2
  - /train_test_split_synthetic/scene_filter@_global_.train_test_split.synthetic_sources.pdm_3.scene_filter: synthetic_reaction_pdm_v1.0-3
  - /train_test_split_synthetic/scene_filter@_global_.train_test_split.synthetic_sources.pdm_4.scene_filter: synthetic_reaction_pdm_v1.0-4
  - _self_

data_split: trainval
training_log_partitions:
  - train
  - val

synthetic_log_root: ${oc.env:OPENSCENE_DATA_ROOT}/navsim_logs
synthetic_sensor_root: ${oc.env:OPENSCENE_DATA_ROOT}/sensor_blobs

expected_real_train_samples: 103288
expected_total_train_samples: 308119

synthetic_sources:
  pdm_0:
    data_split: synthetic_reaction_pdm_v1.0-0
    expected_num_samples: 33000
    require_invalid_tokens: true
    invalid_tokens_sha256: 36fcc93bc406bb76c82987418bb7325cdd369435fdd3b25d7695c178e953246b

  pdm_1:
    data_split: synthetic_reaction_pdm_v1.0-1
    expected_num_samples: 55471
    require_invalid_tokens: false

  pdm_2:
    data_split: synthetic_reaction_pdm_v1.0-2
    expected_num_samples: 46261
    require_invalid_tokens: false

  pdm_3:
    data_split: synthetic_reaction_pdm_v1.0-3
    expected_num_samples: 37897
    require_invalid_tokens: true
    invalid_tokens_sha256: aca651926d7b79cfc0a3eaa9ee10cecd410c21740904121bbdf5a056138c4614

  pdm_4:
    data_split: synthetic_reaction_pdm_v1.0-4
    expected_num_samples: 32202
    require_invalid_tokens: false
