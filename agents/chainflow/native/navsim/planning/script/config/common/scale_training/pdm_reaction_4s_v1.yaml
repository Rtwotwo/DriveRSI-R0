# Model-independent data contract for navtrain_simscale:
# official navtrain + navval real data, plus PDM reaction 0-4.
schema_version: scale-data/v2
enabled: true
protocol: pdm_reaction_4s_v1
expected_total_samples: 308119

# This is the only supervision shared by every model in the standard scale run.
# Model-native score heads may consume additional capabilities through their own
# adapter/config, but those objectives are not part of this data contract.
common_supervision:
  ego_trajectory_4s:
    capability: ego_future_trajectory
    required_quality: exact
    min_horizon_s: 4.0
    min_num_poses: 8
    interval_s: 0.5

sources:
  real_train:
    source_index: 0
    dataset_role: real
    expected_samples: 103288
    metric_cache_name: train_metric_cache
    metric_protocol: navsim_pdm_v1
    observation_horizon_s: 5.0
    future_trajectory_horizon_s: 5.0
    capabilities:
      ego_future_trajectory:
        quality: exact
        max_horizon_s: 5.0
        max_num_poses: 10
        interval_s: 0.5
      dynamic_scene_observation:
        quality: exact
        max_horizon_s: 5.0
      metric_cache:
        quality: exact
        max_horizon_s: 5.0

  pdm_0:
    source_index: 1
    dataset_role: synthetic
    expected_samples: 33000
    metric_cache_name: train_metric_synthetic_reaction_pdm_v1.0-0
    metric_protocol: navsim_pdm_v1
    observation_horizon_s: 4.0
    future_trajectory_horizon_s: 4.0
    capabilities: &pdm_4s_capabilities
      ego_future_trajectory:
        quality: exact
        max_horizon_s: 4.0
        max_num_poses: 8
        interval_s: 0.5
      dynamic_scene_observation:
        quality: exact
