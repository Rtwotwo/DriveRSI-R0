# ChainFlow-MoT-v4: Stage1-from-scratch P1-P5 configuration.
# This file is intentionally independent from v3; do not resume a v3 checkpoint.
_target_: navsim.agents.chainflow_mot_v4.chainflow_vla_agent.ChainFlowVLAAgent

config:

  ####################
  # Trajectory / proposal config
  proposal_num: 64 # number of proposals (trajectories)
  num_poses: 8 # size of the trajectories
  long_trajectory_additional_poses: 2
  ref_num: 4 # number of refining steps
  scorer_ref_num: 4
  shared_refiner: false

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    time_horizon: 4
    interval_length: 0.5

  ####################
  # Stage1: Autoregressive decoder
  num_scene_tokens: 16
  one_token_per_traj: true
  full_history_status: false
  ar_decoder_num_layers: 1
  ar_bicycle_dt: 0.5
  scorer_detach_proposals: true
  pdm_score_detach_proposals: true

  # Structured Counterfactual Mixture-of-Latent-Thoughts
  mot_num_experts: 4
  mot_top_k: 2
  mot_num_thought_tokens: 4
  mot_num_heads: 4
  mot_expert_depths: [1, 2, 2, 1]
  mot_share_experts_across_stages: true
  # P1: shared heavy experts plus tiny stage/expert-private residual adapters.
  # Zero-initialized up projections preserve the original function at step 0.
  mot_stage_adapter_rank: 8
  # P2: low-rank, Lipschitz-controlled multi-anchor router (L2R-SIPS).
  mot_router_type: "l2r"
  mot_router_rank: 2
  mot_router_num_anchors: 4
  mot_router_sips_gamma: 1.0
  mot_router_sips_beta: 1.0
  mot_router_anchor_compression: 4.0
  # Stateless per-scene proposal-norm epsilon; avoids DDP-local BN statistics.
  mot_router_query_norm_eps: 1e-5
  mot_router_temperature: 1.0
  mot_gate_temperature: 1.0
  mot_router_jitter: 0.02
  mot_dropout: 0.1
  # P4: feed calibrated world probabilities back into token refinement through
  # a zero-initialized residual gate. Detaching protects world-head semantics.
  mot_world_feedback_init: 0.0
  mot_world_feedback_detach: true
  # Final P4 world evaluation re-runs the shared experts with q4/P4/S/h4;
  # attenuate only its direct proposal-gradient path.
  mot_score_gradient_scale: 0.1


  ####################
  # Stage2: Diffusion decoder
  use_diffusion_decoder: false
  train_diffusion_decoder_only: false
  train_scorer: true
  diffusion_type: "ddim" # optional: flow_matching
  diffusion_num_layers: 12
  diffusion_num_heads: 8
  diffusion_d_ffn: 1024
  diffusion_delta_scale: 1.0
  diffusion_eval_noise_seed: 0
  diffusion_ego_status_dim: 8
  diffusion_vlm_hidden_dim: 1536
  diffusion_use_ar_proposal_tokens: false
  # DDIM-specific
  ddim_num_train_timesteps: 1000
  ddim_beta_schedule: "scaled_linear"
  diffusion_num_inference_steps: 2
  # Flow-matching-specific
  flow_matching_num_timestep_buckets: 1000
  flow_matching_noise_beta_alpha: 1.5
  flow_matching_noise_beta_beta: 1.0
  flow_matching_noise_scale: 0.999

  ####################
  # VLM feature cache
  use_vlm_feature_cache: false
  vlm_feature_cache_path: ""
  vlm_feature_cache_format: gz
  vlm_feature_cache_name: internvl_feature
  vlm_hidden_key: last_hidden_state

  ####################
  # PDM scoring weights
  noc: 1.0
  dac: 1.0
  ddc: 0.0
  ttc: 5.0
  ep: 5.0
  comfort: 2.0

  ####################
  # Transformer feature dims
  tf_d_model: 256 # general feature size of the model
  tf_d_ffn: 1024 # hidden size of the heads

  ####################
  # Sensor config
  cam_f0: [3]
  cam_l0: [3]
  cam_l1: []
  cam_l2: []
  cam_r0: [3]
  cam_r1: []
  cam_r2: []
  cam_b0: [3]
  lidar_pc: []

  ####################
  # Image branch params
  image_size: [1148, 672] # input image size

  image_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    focus_front_cam: false
    use_feature_pooling: false
    compress_fc: false

  ####################
  # Lidar branch params
  lidar_min_x: -35
  lidar_max_x: 35
  lidar_min_y: -35
  lidar_max_y: 35
  lidar_image_size: [518, 518] # input image size
  lidar_hist_max_per_pixel: 5
  lidar_max_height: 100.0
  lidar_split_height: 0.2
  lidar_use_ground_plane: true
  lidar_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    in_chans: 2 # 2 if use ground plane, 1 otherwise

  ####################
  # Scorer / refiner params
  double_score: false
  agent_pred: false
  area_pred: false
  bev_map: false
  bev_agent: false
  refiner_num_heads: 1
  refiner_ls_values: 0.0
  scorer_use_serial_vlm_context: false
  scorer_use_mode_cross_attention: false
  scorer_mode_cross_attn_heads: null


####################
# Loss weights
loss:
  _target_: navsim.agents.chainflow_mot_v4.losses.loss.ChainFlowVLALoss
  trajectory_weight: 1.0
  inter_weight: 0.02
  sub_score_weight: 0.0
  final_score_weight: 1.0
  pred_ce_weight: 1.0
  pred_l1_weight: 0.1
  pred_area_weight: 2.0
  prev_weight: 0.0
  agent_class_weight: 1.0
  agent_box_weight: 0.1
  bev_semantic_weight: 1.0
  div_weight: 0.0
  diffusion_loss_weight: 10.0
  diffusion_trajectory_loss_weight: 20.0
  # P3: increase semantic/safety supervision without touching the scorer.
  mot_world_weight: 0.40
  mot_specialization_weight: 0.20
  mot_pdms_weight: 0.20
  mot_ranking_weight: 0.15
  mot_progress_weight: 0.02
  mot_safety_progress_weight: 0.08
  mot_false_safe_weight: 0.04
  # P5: exact PDMS/ranking supervise only the final aligned evaluation; earlier
  # stages imitate its detached listwise and six-metric distributions.
  mot_stage_distill_weight: 0.05
  # The decay weights are normalized again by the weighted valid count inside
  # the loss: they set P0:P1:P2:P3 ratios, not an extra absolute attenuation.
  mot_stage_metric_distill_weight: 0.05
  # Disabled for Stage1: all intermediate stages currently reuse the final
  # proposal target, so this is calibration monotonicity rather than true
  # trajectory-refinement supervision.
  mot_refinement_improvement_weight: 0.0
  mot_router_balance_weight: 0.04
  # L2R-SIPS has bounded logits; as in the paper's vision setting, z-loss is off.
  mot_router_z_weight: 0.0
  mot_router_entropy_weight: 0.01
  mot_route_consistency_weight: 0.005
  # Applied to expert-private thoughts before ThoughtExchange.
  mot_thought_diversity_weight: 0.005
  mot_router_entropy_floor: 0.60
  mot_router_entropy_ceiling: 0.75
  mot_pdms_beta: 0.10
  # Equal temperatures make exact PDMS prediction a zero-KL solution.
  mot_rank_target_temperature: 0.10
  mot_rank_student_temperature: 0.10
  mot_false_safe_gain: 3.0
  mot_false_safe_focal_gamma: 2.0
  mot_false_safe_margin: 0.25
  mot_stage_distill_temperature: 0.15
  # Exact world/safety/PDMS/ranking targets are final-only; this decay controls
  # the relative strength of intermediate self-distillation stages.
  mot_stage_loss_decay: 0.6
  # DDC is kept for checkpoint/head compatibility but has zero NAVSIM-v1 PDMS
  # weight; weak supervision prevents it from consuming 1/6 of world-head loss.
  mot_world_ddc_weight: 0.1



####################
# Checkpoint
checkpoint_path: ''
checkpoint_strict_load: false

####################
# Optimizer / scheduler
lr_args:
  name: AdamW
  base_lr: 2e-4
  base_batch_size: 64
scheduler_args:
  num_epochs: 25  # single source of truth for Lightning max_epochs + LR scheduler
  dataset_size: 85000 # for navsim

####################
# Runtime / training
batch_size: ${dataloader.params.batch_size}
num_gpus: 8 # the batchsize is per gpu --> need to update for steps
# null = follow CHAINFLOW_ENABLE_RAY env (default on for training). PDM eval sets agent.enable_ray=false.
enable_ray: null

progress_bar: false # default progress bar. if false replace by a console print every N iterations
console_log_every_n_steps: 100
