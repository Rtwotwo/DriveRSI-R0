_target_: navsim.agents.chainflow_post_stage3_v3.chainflow_vla_agent.ChainFlowVLAAgent

config:

  ####################
  # Trajectory / proposal config
  proposal_num: 64 # number of proposals (trajectories)
  num_poses: 8 # size of the trajectories
  long_trajectory_additional_poses: 2
  ref_num: 4 # number of refining steps
  scorer_ref_num: 4
  shared_refiner: false
  num_scene_tokens: 16
  one_token_per_traj: true
  full_history_status: false

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    time_horizon: 4
    interval_length: 0.5

  ####################
  # Stage1: Autoregressive decoder
  ar_decoder_num_layers: 1
  ar_bicycle_dt: 0.5
  scorer_detach_proposals: true
  pdm_score_detach_proposals: true

  ####################
  # Stage2: Diffusion decoder
  use_diffusion_decoder: true
  train_diffusion_decoder_only: true
  train_scorer: false
  diffusion_type: "ddim" # optional: flow_matching
  diffusion_num_layers: 12
  diffusion_num_heads: 8
  diffusion_d_ffn: 1024
  diffusion_delta_scale: 1.0
  diffusion_eval_noise_seed: 27
  diffusion_ego_status_dim: 8
  diffusion_vlm_hidden_dim: 1536
  diffusion_use_ar_proposal_tokens: false
  # Stage2-compatible proposal conditioning: the new adapter is initialized as
  # an exact no-op and learns to distinguish the AR base only during Stage3.
  stage3_gated_ar_conditioning: true
  # Recompute DiT blocks during policy-replay backward to bound activation memory.
  diffusion_gradient_checkpointing: true
  # DDIM-specific
  ddim_num_train_timesteps: 1000
  ddim_beta_schedule: "scaled_linear"
  diffusion_num_inference_steps: 12

  ####################
  # Stage3 HGRPO: deployment-aligned main pool + same-base auxiliary groups
  # Evaluation remains the original deterministic 12-step DDIM path. These
  # options are active only while model.training is true.
  stage3_rl_enabled: true
  # Required for repeated reentrant DiT checkpoint backward under DDP.
  stage3_ddp_static_graph: true
  stage3_scorer_calibration: false
  train_scorer_only: false
  # Injected by the launcher. Keep YAML portable.
  stage3_reference_checkpoint_path: ""
  stage3_allow_policy_reference_mismatch: false
  # Main policy pool matches deployment exactly: one refinement for each of the
  # 64 distinct AR proposals. Only these 64 enter selector metrics.
  stage3_num_base_modes: 64
  stage3_group_size: 1
  # Select 16 important bases and add three stochastic samples per base. The
  # main sample plus the extras form a true same-condition group of four. Extra
  # samples train only the auxiliary GRPO loss and never enlarge selector pools.
  stage3_aux_enabled: true
  stage3_aux_num_base_modes: 16
  stage3_aux_group_size: 4
  stage3_aux_top_score_modes: 8
  # Frozen-scorer bottom modes are a cheap risk proxy available before PDM runs.
  stage3_aux_low_score_modes: 4
  stage3_aux_diversity_modes: 4
  # "full" replays all 11 stochastic transitions and applies gamma explicitly.
  # "sampled" is a lower-memory unbiased fallback using stage3_replay_steps.
  stage3_replay_mode: "full"
  stage3_replay_steps: 4
  # Lower stochasticity stays closer to deterministic evaluation. gamma=0.8
  # gives an 11-transition chain similar early-step coverage to ReCogDrive's
  # five-step chain with gamma=0.6.
  stage3_ddim_eta: 0.2
  stage3_denoise_gamma: 0.8
  stage3_min_denoise_std: 0.02
  stage3_min_logprob_std: 0.02
  # Flow-matching-specific
  flow_matching_num_timestep_buckets: 1000
  flow_matching_noise_beta_alpha: 1.5
  flow_matching_noise_beta_beta: 1.0
  flow_matching_noise_scale: 0.999

  ####################
  # VLM feature cache
  use_vlm_feature_cache: true
  vlm_feature_cache_path: ""
  vlm_feature_cache_format: gz
  vlm_feature_cache_name: internvl_feature
  vlm_hidden_key: last_hidden_state

  ####################
  # Online VLM inference (switch). When true, InternVL 2B runs online to provide
  # vlm_hidden_state and the .gz cache is NOT used. Keep false to preserve the
  # original cache-based training/eval pipeline. Set use_vlm_feature_cache=false
  # together with use_online_vlm=true for evaluation.
  use_online_vlm: false
  vlm_online_checkpoint_path: ""
  vlm_online_model_type: internvl
  vlm_online_force_image_size: 448
  vlm_online_max_dynamic_patch: 12
  vlm_online_dynamic_image_size: true
  vlm_online_use_thumbnail: true
  vlm_online_num_image_token: 256
  vlm_online_max_length: 2800

  ####################
  # PDM scoring weights
  noc: 1.0
  dac: 1.0
  ddc: 0.0
  ttc: 5.0
  ep: 5.0
  comfort: 2.0

  ####################
  # Transformer feature dims
  tf_d_model: 256 # general feature size of the model
  tf_d_ffn: 1024 # hidden size of the heads
  tf_dropout: 0.0 # required for exact on-policy rollout/replay likelihoods

  ####################
  # Sensor config
  cam_f0: [3]
  cam_l0: [3]
  cam_l1: []
  cam_l2: []
  cam_r0: [3]
  cam_r1: []
  cam_r2: []
  cam_b0: [3]
  lidar_pc: []

  ####################
  # Image branch params
  image_size: [1148, 672] # input image size

  image_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    focus_front_cam: false
    use_feature_pooling: false
    compress_fc: false

  ####################
  # Lidar branch params
  lidar_min_x: -35
  lidar_max_x: 35
  lidar_min_y: -35
  lidar_max_y: 35
  lidar_image_size: [518, 518] # input image size
  lidar_hist_max_per_pixel: 5
  lidar_max_height: 100.0
  lidar_split_height: 0.2
  lidar_use_ground_plane: true
  lidar_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    in_chans: 2 # 2 if use ground plane, 1 otherwise

  ####################
  # Scorer / refiner params
  double_score: false
  agent_pred: false
  area_pred: false
  bev_map: false
  bev_agent: false
  refiner_num_heads: 1
  refiner_ls_values: 0.0
  scorer_use_serial_vlm_context: false
  scorer_use_mode_cross_attention: false
  scorer_mode_cross_attn_heads: null


####################
# Loss weights
loss:
  _target_: navsim.agents.chainflow_post_stage3_v3.post_training.residual_diffgrpo.Stage3PostTrainingLoss
  improvement_scale: 0.05
  improvement_weight: 0.25
  # Lexicographic safety: new zero > component regression > absolute unsafe.
  new_zero_penalty: 3.0
  safety_regression_penalty: 2.0
  absolute_unsafe_penalty: 1.0
  zero_score_threshold: 1e-6
  safety_component_indices: [0, 1, 3]
  safety_floor: 0.999
  # PDM emits TTC=2 when TTC computation fails. Such scenes are excluded from
  # reward-driven policy updates instead of treating the sentinel as safe.
  ttc_component_index: 3
  invalid_ttc_threshold: 1.5
  advantage_clip: 3.0
  # Main-pool rewards use bounded tie-aware ranks. This threshold now only
  # identifies scenes whose raw 64-candidate PDMS spread is degenerate.
  robust_normalization_threshold: 1e-4
  # The frozen selector allocates main-pool gradient but cannot become reward.
  selector_temperature: 0.1
  selector_uniform_mix: 0.25
  selector_weight_clip: 2.5
  selected_candidate_bonus: 0.25
  # Ten-epoch auxiliary schedule. update_step is checkpointed, so resume keeps
  # the correct phase. There are 1,613 optimizer updates per epoch at 8x8 batch.
  aux_epoch_weights: [0.0, 0.05, 0.10, 0.15, 0.15, 0.15, 0.15, 0.10, 0.10, 0.05]
  updates_per_epoch: 1613
  aux_degenerate_threshold: 1e-4
  # Adaptive but tightly bounded official-Stage2 behavior anchor.
  reference_weight: 0.03
  reference_weight_min: 0.02
  reference_weight_max: 0.10
  reference_kl_target: 0.002
  reference_adapt_factor: 1.15
  reference_update_interval: 200
  reference_ema_decay: 0.95
  supervised_weight: 0.05

####################
# Checkpoint
# Injected by the launcher. Keep YAML portable.
checkpoint_path: ""
checkpoint_strict_load: true

####################
# Optimizer / scheduler
lr_args:
  name: AdamW
  base_lr: 3e-6
  base_batch_size: 64
  weight_decay: 1e-4
  # 3e-7 -> 3e-6 over 500 updates, then cosine to 3e-7 over ten epochs.
  warmup_steps: 500
  warmup_start_factor: 0.1
  eta_min: 3e-7
scheduler_args:
  num_epochs: 10
  dataset_size: 103288

####################
# Runtime / training
batch_size: ${dataloader.params.batch_size}
num_gpus: 8 # the batchsize is per gpu --> need to update for steps
# null = follow CHAINFLOW_ENABLE_RAY env (default on for training). PDM eval sets agent.enable_ray=false.
enable_ray: null

progress_bar: false # default progress bar. if false replace by a console print every N iterations
console_log_every_n_steps: 100
