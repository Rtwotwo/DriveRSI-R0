_target_: navsim.agents.chainflow_mot_v2.chainflow_vla_agent.ChainFlowVLAAgent

config:

  ####################
  # Trajectory / proposal config
  proposal_num: 64
  num_poses: 8
  long_trajectory_additional_poses: 2
  ref_num: 4
  scorer_ref_num: 4
  shared_refiner: false

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    time_horizon: 4
    interval_length: 0.5

  ####################
  # Stage 1: autoregressive proposal decoder
  num_scene_tokens: 16
  one_token_per_traj: true
  full_history_status: false
  ar_decoder_num_layers: 1
  ar_bicycle_dt: 0.5
  scorer_detach_proposals: true
  pdm_score_detach_proposals: true

  # Set-Competitive Intent Mixture-of-Thoughts
  # 64 proposals / 8 intents gives each intent an 8-proposal transport capacity.
  mot_num_experts: 8
  mot_num_heads: 4
  mot_expert_depth: 1
  mot_sinkhorn_iterations: 7
  mot_router_temperature: 0.7
  mot_router_jitter: 0.05
  mot_route_persistence: 0.35
  mot_dropout: 0.1
  mot_score_gradient_scale: 0.1

  # Explicitly remain in stage 1.
  use_diffusion_decoder: false
  train_diffusion_decoder_only: false
  train_scorer: true

  ####################
  # VLM feature cache
  use_vlm_feature_cache: false
  vlm_feature_cache_path: ""
  vlm_feature_cache_format: gz
  vlm_feature_cache_name: internvl_feature
  vlm_hidden_key: last_hidden_state

  ####################
  # PDM scoring weights
  noc: 1.0
  dac: 1.0
  ddc: 0.0
  ttc: 5.0
  ep: 5.0
  comfort: 2.0

  ####################
  # Transformer feature dims
  tf_d_model: 256
  tf_d_ffn: 1024

  ####################
  # Sensor config
  cam_f0: [3]
  cam_l0: [3]
  cam_l1: []
  cam_l2: []
  cam_r0: [3]
  cam_r1: []
  cam_r2: []
  cam_b0: [3]
  lidar_pc: []

  ####################
  # Image branch params
  image_size: [1148, 672]

  image_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    focus_front_cam: false
    use_feature_pooling: false
    compress_fc: false

  ####################
  # Lidar branch params
  lidar_min_x: -35
  lidar_max_x: 35
  lidar_min_y: -35
  lidar_max_y: 35
  lidar_image_size: [518, 518]
  lidar_hist_max_per_pixel: 5
  lidar_max_height: 100.0
  lidar_split_height: 0.2
  lidar_use_ground_plane: true
  lidar_backbone:
    model_name: timm/vit_small_patch14_reg4_dinov2.lvd142m
    model_weights: weights/vit_small_patch14_reg4_dinov2.lvd142m/model.safetensors
    use_lora: true
    finetune: false
    lora_rank: 32
    in_chans: 2

  ####################
  # Scorer / refiner params
  double_score: false
  agent_pred: false
  area_pred: false
  bev_map: false
  bev_agent: false
  refiner_num_heads: 1
  refiner_ls_values: 0.0
  scorer_use_serial_vlm_context: false
  scorer_use_mode_cross_attention: false
  scorer_mode_cross_attn_heads: null


####################
# Loss weights
loss:
  _target_: navsim.agents.chainflow_mot_v2.losses.loss.ChainFlowVLALoss
  trajectory_weight: 1.0
  inter_weight: 0.02
  sub_score_weight: 0.0
  final_score_weight: 1.0
  pred_ce_weight: 1.0
  pred_l1_weight: 0.1
  pred_area_weight: 2.0
  prev_weight: 0.0
  agent_class_weight: 1.0
  agent_box_weight: 0.1
  bev_semantic_weight: 1.0
  div_weight: 0.0
  diffusion_loss_weight: 0.0
  diffusion_trajectory_loss_weight: 0.0

  # Branch quality and emergent intent specialization.
  mot_criterion_weight: 0.5
  mot_value_weight: 0.2
  mot_champion_weight: 0.1
  mot_router_balance_weight: 0.05
  mot_router_entropy_weight: 0.01
  mot_assignment_consistency_weight: 0.05
  mot_codebook_commitment_weight: 0.05
  mot_codebook_separation_weight: 0.02
  mot_trajectory_specialization_weight: 0.05
  mot_router_entropy_ceiling: 0.55
  mot_codebook_margin: 0.1
  mot_trajectory_margin: 0.35


####################
# Checkpoint
checkpoint_path: ''
checkpoint_strict_load: false

####################
# Optimizer / scheduler
lr_args:
  name: AdamW
  base_lr: 2e-4
  base_batch_size: 64
scheduler_args:
  num_epochs: 25
  dataset_size: 85000

####################
# Runtime / training
batch_size: ${dataloader.params.batch_size}
num_gpus: 8
enable_ray: null
progress_bar: false
console_log_every_n_steps: 100
