defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: chainflow_fpd_native_teacher
  - _self_
  - override train_test_split: navtrain

hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: false

experiment_name: chainflow_fpd_native_teacher/development
split: trainval
seed: 2
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
navsim_log_path: ${oc.env:OPENSCENE_DATA_ROOT}/navsim_logs/trainval_fut
sensor_blobs_path: ${oc.env:OPENSCENE_DATA_ROOT}/sensor_blobs/trainval_fut
train_ckpt_path: null
auto_resume_search: false
validation_run: false

dataloader:
  params:
    batch_size: 8
    num_workers: 6
    pin_memory: true
    prefetch_factor: 2

trainer:
  params:
    max_epochs: ${agent.scheduler_args.num_epochs}
    accelerator: gpu
    default_root_dir: ${output_dir}
    devices: 8
    num_nodes: 1
    strategy: ddp_find_unused_parameters_true
    precision: bf16-mixed
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    accumulate_grad_batches: 1
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    num_sanity_val_steps: 0
    fast_dev_run: false
