hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: false
defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: chainflow_fut_teacher_v2
  - override /train_test_split: chainflow_fut_teacher_development
  - _self_
split: trainval
experiment_name: chainflow_fut_teacher_v2_development
seed: 2
validation_run: false
train_ckpt_path: null
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
dataloader:
  params:
    batch_size: 16
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
trainer:
  params:
    max_epochs: 16
    accelerator: gpu
    strategy: ddp
    devices: 8
    num_nodes: 1
    precision: 32-true
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_sanity_val_steps: 0
    fast_dev_run: false
    default_root_dir: ${output_dir}
agent:
  scheduler_args:
    num_epochs: ${trainer.params.max_epochs}
    dataset_size: 103288
  config:
    teacher_gradient_accumulation: ${trainer.params.accumulate_grad_batches}
    teacher_development_validation: true
  num_gpus: ${trainer.params.devices}

# Development withholds navval from new-module fitting; actual train size sets the LR schedule.
# Those logs must not be presented as an independent validation set.
# Use recording-disjoint development logs before full refit; NavTest is oracle evaluation.
