hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: false
defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: chainflow_fpd_teacher
  - override /train_test_split: chainflow_fut_teacher_development
  - _self_
split: trainval
experiment_name: chainflow_fpd_teacher_development
seed: 2
validation_run: false
train_ckpt_path: null
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
dataloader:
  params:
    # 8xH20 smoke-tested at 128/GPU; global batch 1024, no accumulation.
    batch_size: 128
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
trainer:
  params:
    max_epochs: 40
    accelerator: gpu
    strategy: ddp
    devices: 8
    num_nodes: 1
    precision: bf16-mixed
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    log_every_n_steps: 20
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    num_sanity_val_steps: 0
    fast_dev_run: false
    default_root_dir: ${output_dir}
agent:
  config:
    teacher_development_validation: true
    expected_train_samples: 85109
# Independent primary Hydra config; shared searchpath cannot be inherited.
# Withheld 18179 scenes select epochs/configurations without using NavTest.
