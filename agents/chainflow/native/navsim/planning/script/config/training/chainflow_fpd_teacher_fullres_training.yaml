hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: false
defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: chainflow_fpd_teacher_fullres
  - override /train_test_split: navtrainval_fut
  - _self_
split: trainval
experiment_name: chainflow_fpd_teacher_fullres
seed: 2
validation_run: false
train_ckpt_path: null
cache_path: null
use_cache_without_dataset: false
force_cache_computation: false
dataloader:
  params:
    # Full-resolution learned scene queries; effective batch 1024 on 8 GPUs.
    batch_size: 128
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
trainer:
  params:
    max_epochs: 40
    accelerator: gpu
    strategy: ddp
    devices: 8
    num_nodes: 1
    precision: bf16-mixed
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    log_every_n_steps: 20
    check_val_every_n_epoch: 1
    val_check_interval: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 0.0
    num_sanity_val_steps: 0
    fast_dev_run: false
    default_root_dir: ${output_dir}
# Full 103288-scene fit includes navval logs. No validation/best claim here.
